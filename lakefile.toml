name = "lemma"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Lemma"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "Lemma"
leanOptions = {linter.dupNamespace = false, linter.unusedTactic = false, linter.style.nameCheck = false, diagnostics.threshold = 1000}

[[lean_lib]]
name = "sympy"

[[lean_lib]]
name = "torch"

[[lean_lib]]
name = "stdlib"

[[lean_lib]]
name = "Syntax"

[[lean_lib]]
name = "Macro"

[[lean_lib]]
name = "Notation"

[[lean_lib]]
name = "Inductive"

[[lean_lib]]
name = "Abbrev"

[[lean_lib]]
name = "Instance"

[[lean_lib]]
name = "Structure"

[[lean_lib]]
name = "Class"

[[lean_lib]]
name = "Def"

[[lean_lib]]
name = "Theorem"
